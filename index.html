    />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preload above-the-fold fonts early (breaks CSS→font chain). -->
    <link rel="preload" href="/fonts/exo-2-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Critical CSS: paints brand + headline before JS (FCP) with CLS-stable sizes. -->
    <style>
      html, body { margin: 0; background: #fff; color: #31454E; }
      @font-face {
        font-family: 'Exo 2';
        font-style: normal;
        font-weight: 800;
        font-display: optional;
        src: url('/fonts/exo-2-latin-800-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 400;
        font-display: optional;
        src: url('/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
      }
      #app-boot {
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
      }
      /* Match sticky navbar min-height (min-h-20 ≈ 80px) to reduce CLS on hydrate */
      #app-boot__bar {
        display: flex;
        align-items: center;
        min-height: 80px;
        border-bottom: 1px solid #f3f4f6;
        padding: 0 1.25rem;
        box-sizing: border-box;
      }
      #app-boot__brand {
        font-family: "Exo 2", ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        font-size: 1.45rem;
        letter-spacing: 0;
      }
      #app-boot__brand span:last-child { color: #23949C; }
      #app-boot__main {
        max-width: 1320px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 2rem;
        display: grid;
        gap: 2.5rem;
        align-items: center;
        box-sizing: border-box;
      }
      @media (min-width: 1024px) {
        #app-boot__main {
          grid-template-columns: 0.87fr 1.13fr;
          padding-left: 2rem;
          padding-right: 2rem;
        }
        #app-boot__visual {
          display: block;
          min-height: 420px;
          border-radius: 1rem;
          background: #F4F4F4;
        }
      }
      #app-boot__copy { max-width: 500px; padding: 3rem 0; }
      #app-boot__eyebrow {
        margin: 0;
        color: #23949C;
        font-family: "Exo 2", ui-sans-serif, system-ui, sans-serif;
        font-weight: 800;
        font-size: 1.25rem;
      }
      #app-boot__title {
        margin: 1rem 0 0;
        max-width: 18ch;
        font-family: "Exo 2", ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(2.4rem, 5vw, 3.6rem);
        font-weight: 800;
        line-height: 1.05;
      }
      #app-boot__lead {
        margin: 2rem 0 0;
        max-width: 42ch;
        font-size: 1rem;
        line-height: 1.75;
        color: rgba(49, 69, 78, 0.8);
      }
      #app-boot__visual { display: none; }
    </style>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.data-brains.net/#organization",
            "name": "DataBrains",
            "url": "https://www.data-brains.net",
            "logo": "https://www.data-brains.net/apple-touch-icon.png",
            "description": "Consultoría tecnológica para empresas y emprendedores.",
            "sameAs": [
              "https://www.linkedin.com/in/data-brains-87a008428/",
              "https://x.com/databrainsagent"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.data-brains.net/#website",
            "url": "https://www.data-brains.net",
            "name": "DataBrains",
            "inLanguage": "es-MX",
            "publisher": { "@id": "https://www.data-brains.net/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-boot">
        <div id="app-boot__bar">
          <div id="app-boot__brand"><span>DAta</span><span>Brains</span></div>
        </div>
        <main id="app-boot__main">
          <div id="app-boot__copy">
            <p id="app-boot__eyebrow">DAtaBrains</p>
            <h1 id="app-boot__title">Transformamos ideas en tecnología efectiva</h1>
            <p id="app-boot__lead">
              Desarrollamos soluciones de software, datos e IA que impulsan la eficiencia,
              optimizan procesos y generan resultados medibles para tu negocio.
            </p>
          </div>
          <div id="app-boot__visual" aria-hidden="true"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
